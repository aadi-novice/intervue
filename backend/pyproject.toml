[project]
name = "intervue-backend"
version = "0.1.0"
description = "Backend for Intervue"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.18.4",
    "authlib>=1.8.0",
    "boto3>=1.43.111",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openai>=2.36.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.27",
    "redis>=6.4.0",
    "ruff>=0.15.12",
    "sentry-sdk[celery,fastapi]>=2.59.0",
    "sqlalchemy>=2.0.49",
    "structlog>=26.1.0",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
# ── Paths ───────────────────────────────────────────────────────────────────
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── Async ───────────────────────────────────────────────────────────────────
# Automatically detect async test functions so @pytest.mark.asyncio isn't
# needed on every async test.
asyncio_mode = "auto"

# ── Markers ─────────────────────────────────────────────────────────────────
markers = [
    "slow: marks tests as slow (e.g. AI service calls, integration)",
    "unit: quick unit tests with no external dependencies",
    "integration: tests that exercise multiple layers (API, DB)",
    "model: database model tests",
    "schema: Pydantic schema validation tests",
    "service: business logic service tests",
]

# ── Coverage ────────────────────────────────────────────────────────────────
# Run with: uv run pytest --cov=app --cov-report=term-missing --cov-report=html
# or just:  uv run pytest --cov=app
addopts = ""

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0          # Set to a percentage (e.g. 60) once baseline is established
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
]
