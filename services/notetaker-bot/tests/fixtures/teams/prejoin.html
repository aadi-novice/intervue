<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Microsoft Teams</title></head>
<body>
  <main id="prejoin">
    <h1>Choose your video and audio options</h1>
    <input type="text" aria-label="Type your name" placeholder="Type your name" value="">
    <button type="button" id="cam" aria-label="Turn camera off">Camera</button>
    <button type="button" id="mic" aria-label="Mute mic">Mic</button>
    <button type="button" aria-label="Audio settings">Audio settings</button>
    <button type="button" id="join">Join now</button>
  </main>
  <main id="lobby" hidden><h2>Someone in the meeting should let you in soon</h2><button type="button">Cancel</button></main>
  <script>
    window.state = { micOff: false, camOff: false, joinedName: null };
    const cam = document.getElementById("cam"), mic = document.getElementById("mic");
    cam.onclick = () => { window.state.camOff = !window.state.camOff; cam.setAttribute("aria-label", window.state.camOff ? "Turn camera on" : "Turn camera off"); };
    mic.onclick = () => { window.state.micOff = !window.state.micOff; mic.setAttribute("aria-label", window.state.micOff ? "Unmute mic" : "Mute mic"); };
    document.getElementById("join").onclick = () => {
      window.state.joinedName = document.querySelector("input").value;
      document.getElementById("prejoin").hidden = true;
      document.getElementById("lobby").hidden = false;
    };
  </script>
</body></html>
