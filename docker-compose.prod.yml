# Single-server production option.
#   cp .env.prod.example .env.prod   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Only Caddy publishes ports (80/443). Frontend proxies /api/* to the backend on the internal network.
# Object storage is NOT included: point S3_* at AWS S3 / Cloudflare R2 / Backblaze B2 in .env.prod.

x-backend: &backend
  build: ./backend
  image: intervue-backend:prod
  restart: unless-stopped
  env_file: .env.prod
  environment: &backend-env
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg2://intervue:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/intervue_db
    REDIS_URL: redis://redis:6379/0
    REFRESH_COOKIE_PATH: /api/auth
    COOKIE_SECURE: "true"
    FRONTEND_URL: https://${DOMAIN:?set DOMAIN}
    PUBLIC_API_URL: https://${DOMAIN}/api
    CORS_ORIGINS: https://${DOMAIN}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Next.js rewrite at build time.
        BACKEND_INTERNAL_URL: http://backend:8000
    image: intervue-frontend:prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "worker", "-l", "info", "-Q", "default", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    # --- OPT-IN: launch notetaker bots with BOT_LAUNCHER=docker ------------------------------------------
    # DockerLauncher starts one bot container per meeting through the Docker API, so the worker needs the
    # host docker socket. SECURITY: access to /var/run/docker.sock is equivalent to root on this host; anyone
    # who can run code in the worker can take over the server. Only enable it on a dedicated single-tenant
    # box, or prefer BOT_LAUNCHER=pool / ecs. To enable: uncomment the lines below, build the bot image
    # (docker compose -f docker-compose.prod.yml --profile bots build bot-image) and set BOT_LAUNCHER=docker
    # and BOT_IMAGE=intervue-notetaker-bot:latest in .env.prod. The worker runs as a non-root user, so also
    # grant it the host docker group id (find it with: getent group docker).
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "999"

  # Only builds the bot image so DockerLauncher can find it locally. Never part of a normal `up`.
  bot-image:
    profiles: ["bots"]
    build: ./services/notetaker-bot
    image: intervue-notetaker-bot:latest
    restart: "no"
    command: ["true"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intervue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: intervue_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervue -d intervue_db"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Nightly logical backup (03:00 container time = UTC) into the pg_backups volume; keeps BACKUP_KEEP_DAYS days.
  # Off-site copy (run from host cron; needs credentials; for R2/B2 add --endpoint-url):
  #   docker run --rm -v <project>_pg_backups:/b:ro -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
  #     amazon/aws-cli s3 sync /b s3://YOUR-BACKUP-BUCKET/pg/
  # (find the volume name with `docker volume ls | grep pg_backups`)
  # Restore: docker compose exec -T pg-backup pg_restore --clean --if-exists -d intervue_db /backups/<file>.dump
  pg-backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: intervue
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: intervue_db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -u
        while true; do
          now=$$(date +%s)
          next=$$(date -d "tomorrow 03:00" +%s)
          sleep $$((next - now))
          f=/backups/intervue_$$(date +%Y%m%d_%H%M%S).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f"; else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'intervue_*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
        done
    volumes:
      - pg_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pg_backups:
  caddy_data:
  caddy_config:
