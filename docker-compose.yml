# Local development stack.
#   docker compose up -d postgres redis minio minio-init   # infra only (run backend/frontend on the host)
#   docker compose up -d --build                           # everything except the transcriber
#   docker compose --profile stt up -d --build             # + transcriber (downloads a large Whisper model)
# Backend env comes from backend/.env (copy backend/.env.example); service hostnames are overridden below.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://intervue:intervue123@postgres:5432/intervue_db
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: intervue-dev
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  REFRESH_COOKIE_PATH: /api/auth
  TRANSCRIBER_URL: http://transcriber:8100

x-backend: &backend
  build: ./backend
  image: intervue-backend:dev
  env_file:
    - path: ./backend/.env
      required: false
  environment: *backend-env

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: intervue_postgres
    environment:
      POSTGRES_USER: intervue
      POSTGRES_PASSWORD: intervue123
      POSTGRES_DB: intervue_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervue -d intervue_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub / quay.io; Chainguard images are the
    # maintained public alternative (the minio image has no curl/mc, hence the bash /dev/tcp healthcheck).
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r line <&3 && [[ "$$line" == *200* ]]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/intervue-dev
        mc anonymous set none local/intervue-dev
        echo "bucket intervue-dev ready (private)"

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "worker", "-l", "info", "-Q", "default", "--concurrency", "2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME -t 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Next.js rewrite at build time (not a runtime setting).
        BACKEND_INTERNAL_URL: http://backend:8000
    image: intervue-frontend:dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  transcriber:
    profiles: ["stt"]
    build:
      context: ./services/transcriber
      dockerfile: Dockerfile.cpu
    image: intervue-transcriber:cpu
    environment:
      PORT: "8100"
      TRANSCRIBER_API_KEY: dev-transcriber-key
      TRANSCRIBER_CALLBACK_SECRET: dev-transcriber-secret
      TRANSCRIBER_MODE: local
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    ports:
      - "8100:8100"
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  whisper_models:
